name: Security Gate (public) / PR & Push Scan
# Org-required workflow for PUBLIC FINGU-GRINDA repos (org ruleset "Security Gate · public repos").
# Public repos cannot run workflows from the private FINGU-GRINDA/security-gate, and must never
# run PR code on self-hosted runners. This lightweight gate runs on GitHub-hosted runners,
# uses no secrets, read-only token, pull_request only (never pull_request_target).
# Layers: 1) secrets in the PR/push commit range (gitleaks, OSS)  2) dangerous Actions patterns.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
  merge_group:
permissions:
  contents: read
jobs:
  scan:
    name: public-gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks
        env:
          V: 8.28.0
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${V}/gitleaks_${V}_linux_x64.tar.gz" | tar -xz -C /usr/local/bin gitleaks
          gitleaks version
      - name: Secrets (gitleaks, commit range)
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          ZERO=0000000000000000000000000000000000000000
          if [ -n "$BASE" ] && [ "$BASE" != "$ZERO" ] && git cat-file -e "$BASE" 2>/dev/null; then
            RANGE="$BASE..$HEAD"
          elif [ -n "$DEFAULT_BRANCH" ] && git rev-parse -q --verify "origin/$DEFAULT_BRANCH" >/dev/null \
               && [ "$(git rev-parse "origin/$DEFAULT_BRANCH")" != "$(git rev-parse "$HEAD")" ]; then
            # New branch push (before=0) or merge_group: scan everything not yet on the default branch.
            RANGE="origin/$DEFAULT_BRANCH..$HEAD"
          else
            RANGE="-1 $HEAD"
          fi
          echo "scan range: $RANGE"
          gitleaks git . "--log-opts=$RANGE" --redact --no-banner --exit-code 1 -v
      - name: Actions (block pull_request_target + head checkout, template injection, secrets dump)
        run: |
          python3 -c 'import yaml' 2>/dev/null || pip install -q pyyaml
          python3 - <<'EOF'
          import glob, re, sys, yaml
          # Attacker-controllable contexts; GitHub expressions are case-insensitive.
          INJ = re.compile(r"\$\{\{[^}]*(github\.event\.(issue|comment|pull_request|review|review_comment|discussion|head_commit|commits|pages|workflow_run)\b[^}]*\b(title|body|message|ref|label|name|email|default_branch|page_name|head_branch)\b|github\.head_ref)[^}]*\}\}", re.I)
          DUMP = re.compile(r"tojson\(\s*secrets\s*\)", re.I)
          HEADREF = re.compile(r"github\.event\.pull_request\.head\.(sha|ref)|github\.head_ref|refs/pull/|github\.event\.number|pull_request\.number", re.I)
          fail = 0
          def err(f, msg):
              global fail; fail = 1; print(f"::error file={f}::{msg}")
          def walk(node, path, f):
              if isinstance(node, dict):
                  for k, v in node.items():
                      if k in ("run", "script") and isinstance(v, str) and INJ.search(v):
                          err(f, f"template injection of untrusted context in {'.'.join(path+[str(k)])}: {INJ.search(v).group(0)}")
                      walk(v, path+[str(k)], f)
              elif isinstance(node, list):
                  for i, v in enumerate(node): walk(v, path+[str(i)], f)
          for f in sorted(glob.glob(".github/workflows/*.y*ml") + glob.glob("**/action.y*ml", recursive=True)):
              text = open(f, encoding="utf-8", errors="replace").read()
              if DUMP.search(text): err(f, "dumps secrets context (toJSON(secrets))")
              try: doc = yaml.safe_load(text)
              except Exception as e: err(f, f"unparseable YAML: {e}"); continue
              if not isinstance(doc, dict): continue
              on = doc.get("on", doc.get(True))
              trig = on if isinstance(on, (list, dict)) else [on]
              if "pull_request_target" in trig and HEADREF.search(text):
                  err(f, "pull_request_target with PR-head reference")
              walk(doc, [], f)
          sys.exit(fail)
          EOF
